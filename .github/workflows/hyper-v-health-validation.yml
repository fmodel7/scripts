name: Hyper-V Health Report - offline validation
on:
  push:
    branches: [main, codex/hyper-v-health-report]
    paths: ['scripts/hyper-v-health-report/**', '.github/workflows/hyper-v-health-validation.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/hyper-v-health-report/**', '.github/workflows/hyper-v-health-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyper-v-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-validation:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            label: Windows PowerShell 5.1
          - os: windows-latest
            shell: pwsh
            label: PowerShell 7 - Windows
          - os: ubuntu-latest
            shell: pwsh
            label: PowerShell 7 - Linux mocks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: scripts/hyper-v-health-report
    steps:
      - uses: actions/checkout@v4
      - name: Parse source and test collection/export with synthetic providers
        run: |
          $ErrorActionPreference='Stop'
          $destination=Join-Path $env:RUNNER_TEMP 'hyper-v-health-evidence'
          $null=New-Item -ItemType Directory -Path $destination -Force
          $PSVersionTable | Out-String | Out-File (Join-Path $destination 'runtime.txt')
          Get-FileHash ./Export-HyperVHealthReport.ps1 -Algorithm SHA256 | Format-List | Out-File (Join-Path $destination 'sha256.txt')
          $engine=(Get-Process -Id $PID).Path
          foreach($test in @('Test-HyperVHealthReport.ps1','Test-HyperVCollectors.ps1')){
            $ErrorActionPreference='Continue'
            & $engine -NoProfile -File "./tests/$test" 2>&1 | Tee-Object -FilePath (Join-Path $destination ($test+'.log'))
            $code=$LASTEXITCODE
            $ErrorActionPreference='Stop'
            if($code -ne 0){throw "$test failed: $code"}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyper-v-health-${{ matrix.os }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/hyper-v-health-evidence/*
          retention-days: 30
          if-no-files-found: warn
