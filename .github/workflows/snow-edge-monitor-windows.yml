name: SNOW Edge Monitor - manual Windows packaging
on: workflow_dispatch
defaults:
  run:
    working-directory: snow-edge-monitor
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - shell: pwsh
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name SNOWEdgeMonitor --collect-all playwright --hidden-import pystray._win32
          --add-data "snow_edge_monitor/extract.js:snow_edge_monitor" run_monitor.py
      - shell: pwsh
        run: Copy-Item config.example.json dist/SNOWEdgeMonitor/config.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: SNOWEdgeMonitor-windows-review
          path: snow-edge-monitor/dist/SNOWEdgeMonitor/
          retention-days: 7
