name: DHCP Transfer - offline validation
on:
  push:
    branches: [main, codex/dhcp-transfer-v1]
    paths: ['scripts/dhcp-transfer/**', '.github/workflows/dhcp-transfer-validation.yml']
  pull_request:
    branches: [main]
    paths: ['scripts/dhcp-transfer/**', '.github/workflows/dhcp-transfer-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dhcp-transfer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-validation:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
            label: Windows PowerShell 5.1
          - os: windows-latest
            shell: pwsh
            label: PowerShell 7 - Windows
          - os: ubuntu-latest
            shell: pwsh
            label: PowerShell 7 - Linux mocks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: scripts/dhcp-transfer
    steps:
      - uses: actions/checkout@v4
      - name: Parse standalone scripts and test isolated DHCP workflows
        run: |
          $ErrorActionPreference='Stop'
          $destination=Join-Path $env:RUNNER_TEMP 'dhcp-transfer-evidence'
          $null=New-Item -ItemType Directory -Path $destination -Force
          $PSVersionTable | Out-String | Out-File (Join-Path $destination 'runtime.txt')
          Get-FileHash ./Export-DHCP.ps1,./Import-DHCP.ps1 -Algorithm SHA256 | Format-List | Out-File (Join-Path $destination 'sha256.txt')
          $childHost=(Get-Process -Id $PID).Path
          & $childHost -NoProfile -File ./tests/Test-DhcpTransfer.ps1 2>&1 | Tee-Object -FilePath (Join-Path $destination 'tests.log')
          if($LASTEXITCODE -ne 0){throw "Offline tests failed: $LASTEXITCODE"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhcp-transfer-${{ matrix.os }}-${{ matrix.shell }}
          path: ${{ runner.temp }}/dhcp-transfer-evidence/*
          retention-days: 30
          if-no-files-found: warn
