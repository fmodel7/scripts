name: SNOW Edge Monitor - synthetic tests
on:
  push:
    paths:
      - 'snow-edge-monitor/**'
      - '.github/workflows/snow-edge-monitor-tests.yml'
  pull_request:
    paths:
      - 'snow-edge-monitor/**'
      - '.github/workflows/snow-edge-monitor-tests.yml'
  workflow_dispatch:
defaults:
  run:
    working-directory: snow-edge-monitor
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python tools/audit_release.py
      - run: python -m unittest discover -s tests -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'browser_*.py' -v
